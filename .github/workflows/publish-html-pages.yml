name: Publicar HTML traduzido — Basic Analysis I

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar HTML do Volume I
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout do livro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout dos assets do PreTeXt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PreTeXtBook/pretext
          ref: 6dca67093899ef93341dfa746747cca297d0c29a
          path: pretext
          sparse-checkout: |
            css
            js
            xsl

      - name: Instalar dependências do conversor
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils xsltproc

      - name: Gerar HTML pt-BR do Volume I
        run: PRETEXT_DIR="$GITHUB_WORKSPACE/pretext" scripts/build-html-pages.sh

      - name: Validar arquivos de entrada do Pages
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/_static/pretext/css/theme.css
          test -s _site/_static/pretext/js/dist/pretext-core.js
          test ! -e _site/realanal2.pdf
          test ! -e _site/realanal12.pdf

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages

    steps:
      - name: Implantar artefato
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
