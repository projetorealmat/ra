name: Publicar release do livro — Basic Analysis I

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      release_pr:
        description: Número da Release PR já mesclada para reexecução manual
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')) }}
    uses: projetorealmat/.github/.github/workflows/book-publish-release.yml@v3
    with:
      config: .realmat/book.json
      release_pr: ${{ github.event_name == 'workflow_dispatch' && inputs.release_pr || '' }}
    secrets: inherit
